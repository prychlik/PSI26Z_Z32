name: z32_zad2

services:
  server:
    build: ./server
    image: z32_zad2_server
    container_name: z32_zad2_server
    command: ["5000"]
    networks:
      z32net:
        ipv4_address: 172.21.32.10

  client:
    build: ./client
    image: z32_zad2_client
    container_name: z32_zad2_client
    command: ["172.21.32.10", "5000"]
    depends_on: [server]
    volumes:
      - ./results:/results
    networks:
      z32net:
        ipv4_address: 172.21.32.20

networks:
  z32net:
    external: true
    name: z32_network
